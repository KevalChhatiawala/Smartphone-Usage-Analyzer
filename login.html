<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smartphone Usage Analyzer</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-icon">📱</span>
                <h1>Welcome Back</h1>
                <p>Login to Smartphone Usage Analyzer</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username"
                           placeholder="Enter username or email" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter password" required>
                </div>

                <div class="auth-error" id="loginError" style="display:none;"></div>

                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                    <span class="btn-icon">🔓</span>
                    Login
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/register">Register here</a></p>
            </div>

            <div class="auth-divider">
                <span>Admin Access</span>
            </div>
            <div class="admin-hint">
                <p>🔐 Admin accounts have access to the admin dashboard with full user management capabilities.</p>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
